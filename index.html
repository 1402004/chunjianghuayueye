<!DOCTYPE html>
<html lang="zh-mo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春江花月夜</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Simplified to Traditional Chinese Conversion Library -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        calligraphy: ['"Zhi Mang Xing"', 'cursive'],
                    },
                    colors: {
                        paper: '#F4ECE1',
                        ink: '#2A2827',
                        accent: '#8B4513',
                        jade: '#2D5A27',
                        amberGold: '#B8860B'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F4ECE1;
            background-image: radial-gradient(#E2D3B8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #2A2827;
        }
        .ink-shadow {
            box-shadow: 0 10px 25px -5px rgba(139, 69, 19, 0.15), 0 8px 10px -6px rgba(139, 69, 19, 0.1);
        }
        .classical-card {
            background: #FAF6EF;
            border: 1px solid #D1C2A5;
        }
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F4ECE1; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-serif selection:bg-amber-200">

    <!-- Header Navigation -->
    <header class="border-b border-amber-900/20 bg-[#FAF6EF]/90 backdrop-blur sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold tracking-widest text-amber-950 font-calligraphy">春江花月夜</h1>
                <span class="text-xs text-amber-800/60 font-medium tracking-wider hidden sm:inline">[唐] 張若虛</span>
            </div>
            <nav class="flex gap-1 bg-amber-900/10 p-1 rounded-lg">
                <button onclick="switchTab('read')" id="btn-read" class="px-4 py-1.5 rounded-md text-sm font-semibold transition-all-300 bg-amber-900 text-paper shadow">全文背誦</button>
                <button onclick="switchTab('blank')" id="btn-blank" class="px-4 py-1.5 rounded-md text-sm font-semibold transition-all-300 text-amber-900 hover:bg-amber-900/10">逐句默寫</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto p-4 sm:p-6 my-2">

        <!-- TAB 1: READ POEM -->
        <section id="tab-read" class="space-y-6">
            <div class="classical-card p-6 sm:p-10 rounded-2xl ink-shadow relative">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold mb-1 text-amber-950 tracking-widest">春江花月夜</h2>
                    <p class="text-xs text-amber-800/80 tracking-widest">唐 · 張若虛</p>
                    <div class="mt-4 flex justify-center gap-4 text-xs">
                        <label class="flex items-center gap-1.5 cursor-pointer bg-amber-900/10 px-3 py-1 rounded-full hover:bg-amber-900/20 transition">
                            <input type="checkbox" id="toggle-pinyin" onchange="togglePinyinDisplay()" class="rounded text-amber-800 focus:ring-amber-900">
                            <span>顯示拼音注音</span>
                        </label>
                    </div>
                </div>

                <div id="poem-container" class="space-y-4 text-center text-lg sm:text-xl leading-relaxed text-stone-800">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

        <!-- TAB 2: BLANK PRACTICE -->
        <section id="tab-blank" class="hidden space-y-4">
            <div class="classical-card p-5 sm:p-8 rounded-2xl ink-shadow">
                
                <!-- Progress Header -->
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-amber-900/15">
                    <h2 class="text-lg font-bold text-amber-950">逐句默寫練習</h2>
                    <div class="flex items-center gap-2">
                        <span class="text-xs bg-amber-900/10 px-3 py-1 rounded-full font-semibold text-amber-900">
                            進度: <span id="blank-progress" class="font-bold">1</span> / 36
                        </span>
                        <button onclick="toggleHint()" class="px-3 py-1 text-xs bg-amber-800 text-paper rounded-full hover:bg-amber-900 transition active:scale-95 shadow">💡 首字提示</button>
                    </div>
                </div>

                <!-- Dynamic Progress Bar -->
                <div class="w-full bg-amber-900/10 h-1.5 rounded-full overflow-hidden mb-5">
                    <div id="progress-bar" class="bg-amber-800 h-full transition-all duration-300" style="width: 2.78%;"></div>
                </div>

                <!-- Active Verse Prompt Area -->
                <div class="space-y-4">
                    <!-- Context Box -->
                    <div class="p-4 bg-amber-900/5 rounded-xl border border-amber-900/10 text-center transition-all-300">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-amber-800/60 font-medium" id="blank-context-label">上一句：</span>
                            <button id="toggle-prev-btn" onclick="togglePrevLineVisibility()" class="text-xs text-amber-800 hover:text-amber-950 underline font-medium cursor-pointer">顯示上一句</button>
                        </div>
                        <p class="text-lg font-bold text-amber-950 tracking-wider transition-all blur-sm select-none" id="blank-hint-text">春江潮水連海平，海上明月共潮生。</p>
                    </div>

                    <!-- Input Area -->
                    <div>
                        <label class="block text-xs font-semibold text-amber-900 mb-1.5">請默寫當前句：</label>
                        <textarea id="user-input-blank" rows="2" class="w-full p-3.5 rounded-xl border border-amber-900/30 bg-white/90 focus:ring-2 focus:ring-amber-800 focus:outline-none font-serif text-lg tracking-wider transition shadow-inner placeholder:text-stone-400 placeholder:text-sm" placeholder="在此輸入答案，按 Enter 下一句..."></textarea>
                    </div>

                    <!-- Action Controls -->
                    <div class="flex justify-between items-center pt-2">
                        <button onclick="prevBlankLine()" class="px-4 py-2 bg-stone-200 hover:bg-stone-300 rounded-lg text-stone-700 text-sm font-semibold transition active:scale-95">← 上一句</button>
                        <button id="next-btn" onclick="nextBlankLine()" class="px-6 py-2 bg-amber-900 text-paper rounded-lg hover:bg-amber-800 font-semibold text-sm transition shadow active:scale-95">下一句 ➔</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="mt-auto py-4 text-center text-xs text-amber-900/50">
        <p>Chon 2026.9.23</p>
    </footer>

    <script>
        const poemData = [
            { line: "春江潮水連海平", pinyin: "chūn jiāng cháo shuǐ lián hǎi píng", section: "第一段：月出驚波" },
            { line: "海上明月共潮生", pinyin: "hǎi shàng míng yuè gòng cháo shēng", section: "第一段：月出驚波" },
            { line: "灩灩隨波千萬里", pinyin: "yàn yàn suí bō qiān wàn lǐ", section: "第一段：月出驚波" },
            { line: "何處春江無月明", pinyin: "hé chù chūn jiāng wú yuè míng", section: "第一段：月出驚波" },
            { line: "江流宛轉繞芳甸", pinyin: "jiāng liú wǎn zhuǎn rào fāng diàn", section: "第一段：月出驚波" },
            { line: "月照花林皆似霰", pinyin: "yuè zhào huā lín jiē sì xiàn", section: "第一段：月出驚波" },
            { line: "空裏流霜不覺飛", pinyin: "kōng lǐ liú shuāng bù jué fēi", section: "第一段：月出驚波" },
            { line: "汀上白沙看不見", pinyin: "tīng shàng bái shā kàn bù jiàn", section: "第一段：月出驚波" },
            { line: "江天一色無纖塵", pinyin: "jiāng tiān yī sè wú xiān chén", section: "第二段：月照江天" },
            { line: "皎皎空中孤月輪", pinyin: "jiǎo jiǎo kōng zhōng gū yuè lún", section: "第二段：月照江天" },
            { line: "江畔何人初見月", pinyin: "jiāng pàn hé rén chū jiàn yuè", section: "第二段：月照江天" },
            { line: "江月何年初照人", pinyin: "jiāng yuè hé nián chū zhào rén", section: "第二段：月照江天" },
            { line: "人生代代無窮已", pinyin: "rén shēng dài dài wú qióng yǐ", section: "第二段：月照江天" },
            { line: "江月年年望相似", pinyin: "jiāng yuè nián nián wàng xiāng sì", section: "第二段：月照江天" },
            { line: "不知江月待何人", pinyin: "bù zhī jiāng yuè dài hé rén", section: "第二段：月照江天" },
            { line: "但見長江送流水", pinyin: "dàn jiàn cháng jiāng sòng liú shuǐ", section: "第二段：月照江天" },
            { line: "白雲一片去悠悠", pinyin: "bái yún yī piàn qù yōu yōu", section: "第三段：思婦懷遠" },
            { line: "青楓浦上不勝愁", pinyin: "qīng fēng pǔ shàng bù shēng chóu", section: "第三段：思婦懷遠" },
            { line: "誰家今夜扁舟子", pinyin: "shuí jiā jīn yè piān zhōu zǐ", section: "第三段：思婦懷遠" },
            { line: "何處相思明月樓", pinyin: "hé chù xiāng sī míng yuè lóu", section: "第三段：思婦懷遠" },
            { line: "可憐樓上月徘徊", pinyin: "kě lián lóu shàng yuè pái huái", section: "第三段：思婦懷遠" },
            { line: "應照離人妝鏡臺", pinyin: "yīng zhào lí rén zhuāng jìng tái", section: "第三段：思婦懷遠" },
            { line: "玉戶簾中卷不去", pinyin: "yù hù lián zhōng juǎn bù qù", section: "第三段：思婦懷遠" },
            { line: "搗衣砧上拂還來", pinyin: "dǎo yī zhēn shàng fú hái lái", section: "第三段：思婦懷遠" },
            { line: "此時相望不相聞", pinyin: "cǐ shí xiāng wàng bù xiāng wén", section: "第四段：月夜感傷" },
            { line: "願逐月華流照君", pinyin: "yuàn zhú yuè huá liú zhào jūn", section: "第四段：月夜感傷" },
            { line: "鴻雁長飛光不度", pinyin: "hóng yàn cháng fēi guāng bù dù", section: "第四段：月夜感傷" },
            { line: "魚龍潛躍水成文", pinyin: "yú lóng qián yuè shuǐ chéng wén", section: "第四段：月夜感傷" },
            { line: "昨夜閒潭夢落花", pinyin: "zuó yè xián tán mèng luò huā", section: "第五段：遊子思歸" },
            { line: "可憐春半不還家", pinyin: "kě lián chūn bàn bù huán jiā", section: "第五段：遊子思歸" },
            { line: "江水流春去欲盡", pinyin: "jiāng shuǐ liú chūn qù yù jìn", section: "第五段：遊子思歸" },
            { line: "江潭落月複西斜", pinyin: "jiāng tán luò yuè fù xī xié", section: "第五段：遊子思歸" },
            { line: "斜月沉沉藏海霧", pinyin: "xié yuè chén chén cáng hǎi wù", section: "第五段：遊子思歸" },
            { line: "碣石瀟湘無限路", pinyin: "jié shí xiāo xiāng wú xiàn lù", section: "第五段：遊子思歸" },
            { line: "不知乘月幾人歸", pinyin: "bù zhī chéng yuè jǐ rén guī", section: "第五段：遊子思歸" },
            { line: "落月搖情滿江樹", pinyin: "luò yuè yáo qíng mǎn jiāng shù", section: "第五段：遊子思歸" }
        ];

        let userAnswers = new Array(poemData.length).fill("");
        let showPrevLine = false;
        let converter = null;

        if (window.OpenCC) {
            converter = OpenCC.Converter({ from: 'cn', to: 'hk' });
        }

        function switchTab(tabId) {
            ['read', 'blank'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
                document.getElementById(`btn-${id}`).className = "px-4 py-1.5 rounded-md text-sm font-semibold transition-all-300 text-amber-900 hover:bg-amber-900/10";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "px-4 py-1.5 rounded-md text-sm font-semibold transition-all-300 bg-amber-900 text-paper shadow";
            
            if (tabId === 'blank') {
                setTimeout(() => document.getElementById('user-input-blank').focus(), 100);
            }
        }

        function renderPoemView() {
            const container = document.getElementById('poem-container');
            let html = '';
            let currentSection = '';

            poemData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    html += `<div class="text-xs font-bold tracking-widest text-amber-900/60 uppercase mt-6 mb-2 border-b border-amber-900/10 pb-1">${currentSection}</div>`;
                }
                html += `
                    <div class="py-1 transition hover:bg-amber-900/5 rounded-lg px-2 cursor-pointer" onclick="openInspector(${index})">
                        <div class="pinyin-line text-xs text-amber-800/70 font-sans tracking-wide hidden mb-0.5 font-medium">${item.pinyin}</div>
                        <div class="text-lg sm:text-xl tracking-widest font-bold text-amber-950">${item.line}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function togglePinyinDisplay() {
            const show = document.getElementById('toggle-pinyin').checked;
            document.querySelectorAll('.pinyin-line').forEach(el => {
                if (show) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        let currentBlankIndex = 0;

        function initBlankMode() {
            updateBlankView();
            const inputField = document.getElementById('user-input-blank');
            inputField.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    nextBlankLine();
                }
            });
        }

        function togglePrevLineVisibility() {
            showPrevLine = !showPrevLine;
            applyPrevLineState();
        }

        function applyPrevLineState() {
            const btn = document.getElementById('toggle-prev-btn');
            const hintText = document.getElementById('blank-hint-text');

            if (showPrevLine) {
                btn.innerText = "隱藏上一句";
                hintText.classList.remove('blur-sm', 'select-none');
            } else {
                btn.innerText = "顯示上一句";
                hintText.classList.add('blur-sm', 'select-none');
            }
        }

        function saveCurrentAnswer() {
            const inputField = document.getElementById('user-input-blank');
            userAnswers[currentBlankIndex] = inputField.value.trim();
        }

        function updateBlankView() {
            document.getElementById('blank-progress').innerText = currentBlankIndex + 1;
            
            const percent = ((currentBlankIndex + 1) / poemData.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            if (currentBlankIndex === 0) {
                document.getElementById('blank-context-label').innerText = "詩首提示：";
                document.getElementById('blank-hint-text').innerText = "《春江花月夜》全詩開頭";
            } else {
                document.getElementById('blank-context-label').innerText = "上一句：";
                document.getElementById('blank-hint-text').innerText = poemData[currentBlankIndex - 1].line;
            }

            applyPrevLineState();

            const inputField = document.getElementById('user-input-blank');
            inputField.value = userAnswers[currentBlankIndex] || '';
            inputField.focus();

            const nextBtn = document.getElementById('next-btn');
            if (currentBlankIndex === poemData.length - 1) {
                nextBtn.innerText = "提交並查看成績 ✨";
                nextBtn.className = "px-6 py-2 bg-emerald-800 text-paper rounded-lg hover:bg-emerald-700 font-semibold text-sm transition shadow active:scale-95";
            } else {
                nextBtn.innerText = "下一句 ➔";
                nextBtn.className = "px-6 py-2 bg-amber-900 text-paper rounded-lg hover:bg-amber-800 font-semibold text-sm transition shadow active:scale-95";
            }
        }

        function toggleHint() {
            const currentItem = poemData[currentBlankIndex];
            const firstChar = currentItem.line.charAt(0);
            alertBox(`💡 首字提示：【 ${firstChar} 】\n全句字數：${currentItem.line.length} 個字`);
        }

        function nextBlankLine() {
            saveCurrentAnswer();
            if (currentBlankIndex < poemData.length - 1) {
                currentBlankIndex++;
                updateBlankView();
            } else {
                showCompletionSummary();
            }
        }

        function prevBlankLine() {
            saveCurrentAnswer();
            if (currentBlankIndex > 0) {
                currentBlankIndex--;
                updateBlankView();
            }
        }

        function cleanText(text) {
            return text.replace(/[，。？！、\s]/g, '').toLowerCase();
        }

        function showCompletionSummary() {
            let correctCount = 0;
            let simplifiedCount = 0;
            let pinyinCount = 0;
            let details = [];

            poemData.forEach((item, i) => {
                let userRaw = userAnswers[i] || "";
                let userClean = cleanText(userRaw);
                let correctClean = cleanText(item.line);
                let pinyinClean = cleanText(item.pinyin);

                let isCorrect = false;
                let isSimplified = false;
                let isPinyin = false;

                if (userClean && userClean === correctClean) {
                    isCorrect = true;
                } else if (userClean && converter && cleanText(converter(userRaw)) === correctClean) {
                    isCorrect = true;
                    isSimplified = true;
                    simplifiedCount++;
                } else if (userClean && userClean === pinyinClean) {
                    isCorrect = true;
                    isPinyin = true;
                    pinyinCount++;
                }

                if (isCorrect) {
                    correctCount++;
                }

                details.push({
                    index: i + 1,
                    correct: item.line,
                    user: userRaw || "（未填寫）",
                    isCorrect: isCorrect,
                    isSimplified: isSimplified,
                    isPinyin: isPinyin
                });
            });

            const total = poemData.length;
            const accuracy = Math.round((correctCount / total) * 100);

            let title = "默寫完成！";
            if (accuracy === 100) title = "🏆 完美全對！功力深厚！";
            else if (accuracy >= 80) title = "👏 表現優異！基本熟練！";
            else if (accuracy >= 50) title = "📖 熟練度尚可，繼續加油！";
            else title = "✍️ 建議多對照原文複習！";

            let summaryHtml = `
                <div class="text-center font-bold text-xl text-amber-950 mb-3">${title}</div>
                <div class="space-y-1 text-sm text-stone-700 bg-amber-900/5 p-4 rounded-xl border border-amber-900/10 mb-4">
                    <p>📊 <strong>正確率：</strong> ${accuracy}%</p>
                    <p>✅ <strong>答對句數：</strong> ${correctCount} / ${total}</p>
                    <p>❌ <strong>錯漏句數：</strong> ${total - correctCount} 句</p>
                    ${simplifiedCount > 0 ? `<p class="text-xs text-amber-800 mt-2">⚠️ 共有 ${simplifiedCount} 句使用簡體字（已算答對，建議改用繁體字）</p>` : ''}
                    ${pinyinCount > 0 ? `<p class="text-xs text-amber-800 mt-1">⚠️ 共有 ${pinyinCount} 句使用拼音（已算答對，建議改用繁體字）</p>` : ''}
                </div>
            `;

            let incorrectOrWarns = details.filter(d => !d.isCorrect || d.isSimplified || d.isPinyin);

            if (incorrectOrWarns.length > 0) {
                summaryHtml += `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-bold text-amber-950">答題細節與記錄：</span>
                    </div>
                    <div class="max-h-48 overflow-y-auto space-y-2 text-xs pr-1 border-t border-b border-amber-900/10 py-2 mb-4">
                        ${incorrectOrWarns.map(d => {
                            if (!d.isCorrect) {
                                return `
                                    <div class="bg-red-50/70 p-2.5 rounded-lg border border-red-200/60">
                                        <div class="font-bold text-red-900">第 ${d.index} 句（錯誤）</div>
                                        <div class="text-emerald-800 font-semibold">原句：${d.correct}</div>
                                        <div class="text-red-700">您的答案：${d.user}</div>
                                    </div>
                                `;
                            } else {
                                let label = d.isSimplified ? "簡體字提醒" : "拼音提醒";
                                return `
                                    <div class="bg-amber-50/70 p-2.5 rounded-lg border border-amber-200/60">
                                        <div class="font-bold text-amber-900">第 ${d.index} 句（${label} - 已算答對）</div>
                                        <div class="text-emerald-800 font-semibold">原句：${d.correct}</div>
                                        <div class="text-amber-800">您的答案：${d.user}</div>
                                    </div>
                                `;
                            }
                        }).join('')}
                    </div>
                `;
            } else {
                summaryHtml += `<p class="text-center text-sm text-emerald-800 font-bold my-4">🎉 太棒了，全部使用繁體字正確默寫！</p>`;
            }

            alertCustomModal(summaryHtml, details.some(d => !d.isCorrect));
        }

        function alertCustomModal(contentHtml, hasErrors) {
            let modal = document.getElementById('custom-alert');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'custom-alert';
                modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                <div class="bg-[#FAF6EF] border-2 border-amber-900 p-6 rounded-2xl max-w-md w-full shadow-2xl transform transition-all max-h-[85vh] flex flex-col">
                    <div id="custom-alert-msg" class="text-amber-950 font-serif text-base leading-relaxed overflow-y-auto flex-grow">
                        ${contentHtml}
                    </div>
                    <div class="mt-4 pt-2 border-t border-amber-900/10 flex gap-2">
                        ${hasErrors ? `<button onclick="jumpToFirstError()" class="px-4 py-2 bg-amber-800 text-paper rounded-lg font-semibold text-xs shadow hover:bg-amber-900 transition active:scale-95 flex-1">修改第一個錯題</button>` : ''}
                        <button onclick="document.getElementById('custom-alert').classList.add('hidden')" class="px-4 py-2 bg-stone-300 text-stone-800 rounded-lg font-semibold text-xs shadow hover:bg-stone-400 transition active:scale-95 flex-1">關閉</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function jumpToFirstError() {
            document.getElementById('custom-alert').classList.add('hidden');
            for (let i = 0; i < poemData.length; i++) {
                let userClean = cleanText(userAnswers[i] || "");
                let correctClean = cleanText(poemData[i].line);
                let pinyinClean = cleanText(poemData[i].pinyin);
                
                let isCorrect = userClean && (userClean === correctClean || (converter && cleanText(converter(userAnswers[i] || "")) === correctClean) || userClean === pinyinClean);
                
                if (!isCorrect) {
                    currentBlankIndex = i;
                    updateBlankView();
                    break;
                }
            }
        }

        function alertBox(message) {
            alertCustomModal(`<p class="whitespace-pre-line text-center py-4">${message}</p>`, false);
        }

        function openInspector(index) {
            const item = poemData[index];
            alertBox(`【第 ${index + 1} 句】\n詩句：${item.line}\n拼音：${item.pinyin}\n段落：${item.section}`);
        }

        window.onload = function() {
            renderPoemView();
            initBlankMode();
        };
    </script>
</body>
</html>
