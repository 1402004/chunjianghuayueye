<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春江花月夜 · 詩詞默寫</title>
    <!-- Tailwind CSS for modern responsive layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for classical feel -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        calligraphy: ['"Zhi Mang Xing"', 'cursive'],
                    },
                    colors: {
                        paper: '#F4ECE1',
                        ink: '#2A2827',
                        accent: '#8B4513',
                        jade: '#3A5F43',
                        gold: '#C5A059'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F4ECE1;
            background-image: radial-gradient(#E8DCC4 1px, transparent 1px);
            background-size: 24px 24px;
            color: #2A2827;
        }
        .ink-border {
            border: 2px solid #8B4513;
            box-shadow: 4px 4px 0px rgba(139, 69, 19, 0.2);
        }
        .classical-card {
            background: #FAF6EF;
            border: 1px solid #D1C2A5;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F4ECE1;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1C2A5;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-serif selection:bg-amber-200">

    <header class="border-b border-amber-900/20 bg-[#FAF6EF]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-bold tracking-widest text-amber-900 font-calligraphy">春江花月夜</h1>
                <p class="text-xs text-amber-800/70 tracking-wider">[唐] 張若虛</p>
            </div>
            <!-- Navigation Tabs -->
            <nav class="flex flex-wrap gap-1 bg-amber-900/10 p-1.5 rounded-lg">
                <button onclick="switchTab('read')" id="btn-read" class="px-4 py-1.5 rounded text-sm font-medium transition-all bg-amber-900 text-paper shadow">全文朗讀</button>
                <button onclick="switchTab('blank')" id="btn-blank" class="px-4 py-1.5 rounded text-sm font-medium transition-all text-amber-900 hover:bg-amber-900/20">逐句默寫</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 my-4">

        <!-- TAB 1: FULL POEM & READING / COMPARISON -->
        <section id="tab-read" class="space-y-6">
            <div class="classical-card p-6 sm:p-10 rounded-xl ink-border relative overflow-hidden">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold mb-2 text-amber-900">春江花月夜</h2>
                    <p class="text-sm text-amber-800/80 tracking-widest">唐 · 張若虛</p>
                    <div class="mt-4 flex justify-center gap-4 text-xs">
                        <label class="flex items-center gap-1.5 cursor-pointer bg-amber-900/10 px-3 py-1 rounded-full hover:bg-amber-900/20 transition">
                            <input type="checkbox" id="toggle-pinyin" onchange="togglePinyinDisplay()" class="rounded text-amber-800 focus:ring-amber-900">
                            <span>顯示拼音注音</span>
                        </label>
                    </div>
                </div>

                <!-- Poem Content Container -->
                <div id="poem-container" class="space-y-6 text-center text-lg sm:text-xl leading-relaxed font-serif text-stone-800">
                    <!-- Populated dynamically via script -->
                </div>
            </div>
        </section>

        <!-- TAB 2: BLANK FILLING / SENTENCE RECITATION -->
        <section id="tab-blank" class="hidden space-y-6">
            <div class="classical-card p-6 sm:p-8 rounded-xl ink-border">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-amber-900/20">
                    <div>
                        <h2 class="text-xl font-bold text-amber-900">逐句默寫</h2>
                        <p class="text-xs text-amber-800/70 mt-1">按順序默寫全詩。在輸入框按 <kbd class="px-1.5 py-0.5 bg-amber-900/10 rounded font-sans text-xs border border-amber-900/20">Enter</kbd> 鍵提交，再次按 <kbd class="px-1.5 py-0.5 bg-amber-900/10 rounded font-sans text-xs border border-amber-900/20">Enter</kbd> 進入下一句。</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs bg-amber-900/10 px-3 py-1.5 rounded font-medium">當前進度: <span id="blank-progress" class="font-bold text-amber-900">1</span> / <span id="blank-total">36</span></span>
                        <button onclick="toggleHint()" class="px-3 py-1.5 text-xs bg-amber-700 text-paper rounded hover:bg-amber-800 transition shadow active:scale-95">💡 提示首字</button>
                    </div>
                </div>

                <!-- Active Verse Prompt Area -->
                <div class="space-y-4">
                    <div class="p-4 bg-amber-900/5 rounded-lg border border-amber-900/10 text-center">
                        <p class="text-xs text-amber-800/70 mb-1" id="blank-context-label">上一句：</p>
                        <p class="text-lg font-semibold text-amber-950" id="blank-hint-text">春江潮水連海平，海上明月共潮生。</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-amber-900 mb-1" id="current-line-label">請默寫下一句：</label>
                        <textarea id="user-input-blank" rows="2" class="w-full p-4 rounded-lg border border-amber-900/30 bg-white/80 focus:ring-2 focus:ring-amber-900 focus:outline-none font-serif text-lg tracking-wider transition" placeholder="在此輸入繁體詩句，按 Enter 提交..."></textarea>
                    </div>

                    <!-- Feedback Area -->
                    <div id="feedback-area" class="hidden p-4 rounded-lg text-sm transition-all duration-300"></div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="prevBlankLine()" class="px-4 py-2 bg-stone-200 hover:bg-stone-300 rounded text-stone-700 text-sm font-medium transition active:scale-95">上一句</button>
                        <div class="space-x-2">
                            <button id="submit-btn" onclick="handleBlankAction()" class="px-6 py-2 bg-amber-900 text-paper rounded hover:bg-amber-800 font-medium transition shadow active:scale-95">提交核對</button>
                            <button onclick="nextBlankLine()" class="px-4 py-2 bg-amber-700 text-paper rounded hover:bg-amber-800 text-sm font-medium transition active:scale-95">下一句 ➔</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="mt-auto py-6 text-center text-xs text-amber-900/60 border-t border-amber-900/10">
        <p>Chon 2026.9.23</p>
    </footer>

    <script>
        const poemData = [
            { line: "春江潮水連海平", pinyin: "chūn jiāng cháo shuǐ lián hǎi píng", section: "第一段：月出驚波" },
            { line: "海上明月共潮生", pinyin: "hǎi shàng míng yuè gòng cháo shēng", section: "第一段：月出驚波" },
            { line: "灩灩隨波千萬里", pinyin: "yàn yàn suí bō qiān wàn lǐ", section: "第一段：月出驚波" },
            { line: "何處春江無月明", pinyin: "hé chù chūn jiāng wú yuè míng", section: "第一段：月出驚波" },
            { line: "江流宛轉繞芳甸", pinyin: "jiāng liú wǎn zhuǎn rào fāng diàn", section: "第一段：月出驚波" },
            { line: "月照花林皆似霰", pinyin: "yuè zhào huā lín jiē sì xiàn", section: "第一段：月出驚波" },
            { line: "空裏流霜不覺飛", pinyin: "kōng lǐ liú shuāng bù jué fēi", section: "第一段：月出驚波" },
            { line: "汀上白沙看不見", pinyin: "tīng shàng bái shā kàn bù jiàn", section: "第一段：月出驚波" },
            { line: "江天一色無纖塵", pinyin: "jiāng tiān yī sè wú xiān chén", section: "第二段：月照江天" },
            { line: "皎皎空中孤月輪", pinyin: "jiǎo jiǎo kōng zhōng gū yuè lún", section: "第二段：月照江天" },
            { line: "江畔何人初見月", pinyin: "jiāng pàn hé rén chū jiàn yuè", section: "第二段：月照江天" },
            { line: "江月何年初照人", pinyin: "jiāng yuè hé nián chū zhào rén", section: "第二段：月照江天" },
            { line: "人生代代無窮已", pinyin: "rén shēng dài dài wú qióng yǐ", section: "第二段：月照江天" },
            { line: "江月年年望相似", pinyin: "jiāng yuè nián nián wàng xiāng sì", section: "第二段：月照江天" },
            { line: "不知江月待何人", pinyin: "bù zhī jiāng yuè dài hé rén", section: "第二段：月照江天" },
            { line: "但見長江送流水", pinyin: "dàn jiàn cháng jiāng sòng liú shuǐ", section: "第二段：月照江天" },
            { line: "白雲一片去悠悠", pinyin: "bái yún yī piàn qù yōu yōu", section: "第三段：思婦懷遠" },
            { line: "青楓浦上不勝愁", pinyin: "qīng fēng pǔ shàng bù shèng chóu", section: "第三段：思婦懷遠" },
            { line: "誰家今夜扁舟子", pinyin: "shuí jiā jīn yè piān zhōu zǐ", section: "第三段：思婦懷遠" },
            { line: "何處相思明月樓", pinyin: "hé chù xiāng sī míng yuè lóu", section: "第三段：思婦懷遠" },
            { line: "可憐樓上月徘徊", pinyin: "kě lián lóu shàng yuè pái huái", section: "第三段：思婦懷遠" },
            { line: "應照離人妝鏡臺", pinyin: "yīng zhào lí rén zhuāng jìng tái", section: "第三段：思婦懷遠" },
            { line: "玉戶簾中卷不去", pinyin: "yù hù lián zhōng juǎn bù qù", section: "第三段：思婦懷遠" },
            { line: "搗衣砧上拂還來", pinyin: "dǎo yī zhēn shàng fú hái lái", section: "第三段：思婦懷遠" },
            { line: "此時相望不相聞", pinyin: "cǐ shí xiāng wàng bù xiāng wén", section: "第四段：月夜感傷" },
            { line: "願逐月華流照君", pinyin: "yuàn zhú yuè huá liú zhào jūn", section: "第四段：月夜感傷" },
            { line: "鴻雁長飛光不度", pinyin: "hóng yàn cháng fēi guāng bù dù", section: "第四段：月夜感傷" },
            { line: "魚龍潛躍水成文", pinyin: "yú lóng qián yuè shuǐ chéng wén", section: "第四段：月夜感傷" },
            { line: "昨夜閒潭夢落花", pinyin: "zuó yè xián tán mèng luò huā", section: "第五段：遊子思歸" },
            { line: "可憐春半不還家", pinyin: "kě lián chūn bàn bù huán jiā", section: "第五段：遊子思歸" },
            { line: "江水流春去欲盡", pinyin: "jiāng shuǐ liú chūn qù yù jìn", section: "第五段：遊子思歸" },
            { line: "江潭落月複西斜", pinyin: "jiāng tán luò yuè fù xī xié", section: "第五段：遊子思歸" },
            { line: "斜月沉沉藏海霧", pinyin: "xié yuè chén chén cáng hǎi wù", section: "第五段：遊子思歸" },
            { line: "碣石瀟湘無限路", pinyin: "jié shí xiāo xiāng wú xiàn lù", section: "第五段：遊子思歸" },
            { line: "不知乘月幾人歸", pinyin: "bù zhī chéng yuè jǐ rén guī", section: "第五段：遊子思歸" },
            { line: "落月搖情滿江樹", pinyin: "luò yuè yáo qíng mǎn jiāng shù", section: "第五段：遊子思歸" }
        ];

        // Track user results for all lines (null: unattempted, true: correct, false: wrong)
        let lineResults = new Array(poemData.length).fill(null);

        function switchTab(tabId) {
            ['read', 'blank'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
                document.getElementById(`btn-${id}`).className = "px-4 py-1.5 rounded text-sm font-medium transition-all text-amber-900 hover:bg-amber-900/20";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "px-4 py-1.5 rounded text-sm font-medium transition-all bg-amber-900 text-paper shadow";
            
            if (tabId === 'blank') {
                setTimeout(() => document.getElementById('user-input-blank').focus(), 100);
            }
        }

        function renderPoemView() {
            const container = document.getElementById('poem-container');
            let html = '';
            let currentSection = '';

            poemData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    html += `<div class="text-xs font-semibold tracking-widest text-amber-800/60 uppercase mt-6 mb-3 border-b border-amber-900/10 pb-1">${currentSection}</div>`;
                }
                html += `
                    <div class="py-1 transition hover:bg-amber-900/5 rounded px-2 group cursor-pointer" onclick="openInspector(${index})" title="點擊查看釋義">
                        <div class="pinyin-line text-xs text-amber-800/60 font-sans tracking-wide hidden mb-0.5">${item.pinyin}</div>
                        <div class="text-xl tracking-widest font-bold text-amber-950">${item.line}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function togglePinyinDisplay() {
            const show = document.getElementById('toggle-pinyin').checked;
            document.querySelectorAll('.pinyin-line').forEach(el => {
                if (show) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        let currentBlankIndex = 0;
        let isCheckedState = false;

        function initBlankMode() {
            document.getElementById('blank-total').innerText = poemData.length;
            updateBlankView();

            const inputField = document.getElementById('user-input-blank');
            inputField.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleBlankAction();
                }
            });
        }

        function updateBlankView() {
            document.getElementById('blank-progress').innerText = currentBlankIndex + 1;
            
            if (currentBlankIndex === 0) {
                document.getElementById('blank-context-label').innerText = "詩首提示：";
                document.getElementById('blank-hint-text').innerText = "全詩開頭（可點擊右上角按鈕獲取首字提示）";
            } else {
                document.getElementById('blank-context-label').innerText = "上一句：";
                document.getElementById('blank-hint-text').innerText = poemData[currentBlankIndex - 1].line;
            }

            const inputField = document.getElementById('user-input-blank');
            inputField.value = '';
            inputField.focus();
            
            document.getElementById('feedback-area').classList.add('hidden');
            isCheckedState = false;
            document.getElementById('submit-btn').innerText = "提交核對";
        }

        function toggleHint() {
            const currentItem = poemData[currentBlankIndex];
            const firstChar = currentItem.line.charAt(0);
            alertBox(`本句首字提示為：【 ${firstChar} 】\n全句共有 ${currentItem.line.length} 個字。`);
        }

        function handleBlankAction() {
            const submitBtn = document.getElementById('submit-btn');
            
            if (isCheckedState) {
                nextBlankLine();
                return;
            }

            const userText = document.getElementById('user-input-blank').value.trim();
            const correctText = poemData[currentBlankIndex].line;
            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.classList.remove('hidden');

            const cleanUser = userText.replace(/[，。？！、\s]/g, '');
            const cleanCorrect = correctText.replace(/[，。？！、\s]/g, '');

            if (cleanUser === cleanCorrect) {
                lineResults[currentBlankIndex] = true;
                feedbackArea.className = "p-4 rounded-lg text-sm bg-emerald-950/10 border border-emerald-900/30 text-emerald-900 font-medium flex flex-col gap-1";
                feedbackArea.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-lg">✨</span>
                        <span class="font-bold">完全正確！</span>
                    </div>
                    <div class="text-xs text-emerald-800/80 mt-1">答案：<span class="font-bold tracking-wider">${correctText}</span></div>
                `;
                isCheckedState = true;
                submitBtn.innerText = "下一句 ➔";
            } else {
                lineResults[currentBlankIndex] = false;
                feedbackArea.className = "p-4 rounded-lg text-sm bg-rose-950/10 border border-rose-900/30 text-rose-900 flex flex-col gap-3";
                feedbackArea.innerHTML = `
                    <div class="flex items-center gap-2 font-bold">
                        <span class="text-lg">❌</span>
                        <span>回答有誤或包含錯別字</span>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button onclick="revealAnswer()" class="px-3 py-1 bg-rose-900 text-paper rounded text-xs hover:bg-rose-800 transition active:scale-95 shadow">💡 顯示標準答案</button>
                        <button onclick="retryLine()" class="px-3 py-1 bg-stone-300 text-stone-800 rounded text-xs hover:bg-stone-400 transition active:scale-95">🔄 重新試一次</button>
                    </div>
                `;
            }
        }

        function revealAnswer() {
            const correctText = poemData[currentBlankIndex].line;
            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.className = "p-4 rounded-lg text-sm bg-amber-950/10 border border-amber-900/30 text-amber-900 font-medium";
            feedbackArea.innerHTML = `
                <div class="text-xs text-amber-800/70 mb-1">標準答案：</div>
                <div class="font-bold tracking-widest text-lg text-amber-950 mb-2">${correctText}</div>
                <div class="text-xs text-amber-800/70">請核對並加深印象，按 Enter 或點擊「下一句」繼續。</div>
            `;
            isCheckedState = true;
            document.getElementById('submit-btn').innerText = "下一句 ➔";
        }

        function retryLine() {
            const inputField = document.getElementById('user-input-blank');
            inputField.value = '';
            document.getElementById('feedback-area').classList.add('hidden');
            inputField.focus();
        }

        function nextBlankLine() {
            if (currentBlankIndex < poemData.length - 1) {
                currentBlankIndex++;
                updateBlankView();
            } else {
                showCompletionSummary();
            }
        }

        function prevBlankLine() {
            if (currentBlankIndex > 0) {
                currentBlankIndex--;
                updateBlankView();
            }
        }

        function showCompletionSummary() {
            const correctCount = lineResults.filter(r => r === true).length;
            const total = poemData.length;
            const accuracy = Math.round((correctCount / total) * 100);

            let title = "默寫完成！";
            if (accuracy === 100) title = "🏆 完美全對！功力深厚！";
            else if (accuracy >= 80) title = "👏 表現相當優異！";
            else if (accuracy >= 50) title = "📖 熟練度尚可，再接再厲！";
            else title = "✍️ 建議多對照原文複習喔！";

            const msg = `${title}\n\n📊 默寫成績單：\n• 正確率：${accuracy}%\n• 正確句數：${correctCount} / ${total}\n• 錯漏句數：${total - correctCount} 句`;
            
            alertBox(msg);
        }

        function alertBox(message) {
            let modal = document.getElementById('custom-alert');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'custom-alert';
                modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-50 p-4';
                modal.innerHTML = `
                    <div class="bg-[#FAF6EF] border-2 border-amber-900 p-6 rounded-xl max-w-sm w-full text-center shadow-xl transform transition-all">
                        <p id="custom-alert-msg" class="text-amber-950 mb-6 font-serif text-lg leading-relaxed whitespace-pre-line"></p>
                        <button onclick="document.getElementById('custom-alert').classList.add('hidden')" class="px-6 py-2 bg-amber-900 text-paper rounded font-medium shadow hover:bg-amber-800 transition active:scale-95">確定</button>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            document.getElementById('custom-alert-msg').innerText = message;
            modal.classList.remove('hidden');
        }

        function openInspector(index) {
            const item = poemData[index];
            alertBox(`【第 ${index + 1} 句】\n詩句：${item.line}\n拼音：${item.pinyin}\n歸屬：${item.section}`);
        }

        window.onload = function() {
            renderPoemView();
            initBlankMode();
        };
    </script>
</body>
</html>
